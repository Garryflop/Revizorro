[project]
name = "revizorro"
version = "0.1.0"
description = "ИИ-агент статической проверки требований: ISO/IEC/IEEE 29148, IEEE 830, отчёт на русском"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai,google]==2.67.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "typer>=0.20",
    "rich>=14",
    "jinja2>=3.1",
    "markdown-it-py>=4.0",
    "pymupdf4llm>=1.27",
    "python-docx>=1.2",
    "pyyaml>=6.0",
    # web interface (revizorro-api); part of the default install so the README commands work as written
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "sse-starlette>=3.0",
    "python-multipart>=0.0.20",
]

[project.scripts]
revizorro = "revizorro.cli:app"
revizorro-api = "revizorro.api.app:serve"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.15",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revizorro"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # Cyrillic text is intentional; formatter owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
