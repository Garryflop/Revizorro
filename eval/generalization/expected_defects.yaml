# Эталон для eval/generalization/phone_transfer.md — синтетического ТЗ из другой предметной области.
# Документ написан специально для проверки, что агент не заточен под выданный пример.
# Формат тот же, что в eval/expected_defects.yaml.

- id: G01
  title: Дневной лимит 500 000 ₸ в FR-2 против 300 000 ₸ в таблице лимитов
  severity: critical
  anchors: ["не превышает 500 000 ₸ в день", "Лимит переводов в сутки"]
  keywords: ["500 000", "300 000", "лимит"]

- id: G02
  title: Комиссия по FR-4 за 150 000 ₸ равна 250 ₸, а критерий приёмки ожидает 500 ₸
  severity: critical
  anchors: ["Комиссия 500 ₸", "0,5% с суммы превышения"]
  keywords: ["250", "500", "комисси"]

- id: G03
  title: FR-7 (SMS свыше 50 000 ₸) и FR-8 (биометрия для всех переводов) не согласованы
  severity: major
  anchors: ["подтверждается кодом из SMS", "Все переводы подтверждаются биометрией"]
  keywords: ["биометр", "SMS", "подтвержд"]

- id: G04
  title: «Данные получателя не хранятся» против хранения номера телефона получателя 3 года
  severity: critical
  anchors: ["Данные получателя не хранятся", "Хранить номер телефона получателя"]
  keywords: ["хран"]

- id: G05
  title: «Мгновенно» в FR-3 неизмеримо
  severity: major
  anchors: ["зачисляется получателю мгновенно"]
  keywords: ["мгновенн", "измер", "срок", "врем"]

- id: G06
  title: «Понятное сообщение» в FR-5 — не определены ошибки и тексты
  severity: major
  anchors: ["клиент видит понятное сообщение"]
  keywords: ["понятн", "ошиб", "текст", "сообщени"]

- id: G07
  title: Открытый перечень «и т.д.» в FR-6
  severity: minor
  anchors: ["вводом номера и т.д."]
  keywords: ["и т.д", "перечен", "открыт", "способ"]

- id: G08
  title: «Высокая нагрузка» неизмерима
  severity: major
  anchors: ["выдерживать высокую нагрузку"]
  keywords: ["нагруз", "измер"]

- id: G09
  title: FR-1 неатомарно
  severity: minor
  anchors: ["Клиент выбирает счёт списания"]
  keywords: ["атомар", "несколько", "объедин", "раздел", "независим"]

- id: G10
  title: Перевод 20 000 ₸ при 290 000 ₸ отклонён — согласуется только с лимитом 300 000, но не с FR-2
  severity: major
  anchors: ["Сегодня переведено 290 000 ₸"]
  keywords: ["290", "лимит", "отклон", "500 000", "300 000"]

- id: G11
  title: Не задан часовой пояс и связь «дня», «суток» и операционного дня до 23:00
  severity: major
  anchors: ["Окончание операционного дня", "не превышает 500 000 ₸ в день", "Лимит переводов в сутки"]
  keywords: ["часов", "пояс", "сутк", "операционн", "23:00"]

- id: G12
  title: Не описано, что делать, если получатель не найден или у него нет счёта
  severity: major
  anchors: ["клиент выбирает банк получателя", "Получатель выбирается из списка контактов", "показывает комиссию и имя получателя"]
  keywords: ["не найден", "нет счёта", "нет счета", "не клиент", "отсутств", "не зарегистр"]

- id: G13
  title: Пустые разделы «Откат» и «Согласование», версия не указана
  severity: minor
  anchors: ["Откат", "Версия документа: не указана", "Роль | ФИО | Дата"]
  keywords: ["откат", "верси", "соглас", "заполн", "пуст"]

- id: G14
  title: Кнопка неактивна при 99 ₸ — поведение ниже минимальной суммы не описано в требованиях
  severity: minor
  anchors: ["Сумма перевода 99 ₸", "Минимальная сумма перевода"]
  keywords: ["миним", "99", "неактивн"]
