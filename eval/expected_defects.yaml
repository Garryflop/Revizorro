# Эталон дефектов для examples/requirements.md, размеченный вручную.
# Используется только для измерения качества агента; в промпты не попадает.
#
# Находка агента засчитывается дефекту, если:
#   - одна из её локаций указывает на блок, содержащий любую из фраз anchors (если anchors заданы),
#     или её свойство входит в criteria (если anchors пусты);
#   - и в заголовке, описании или предложении находки есть хотя бы одно из keywords (если заданы).
# severity — ожидаемая серьёзность по мнению разметчика.

- id: D01
  title: Ф-2 противоречит критерию приёмки 2 (месяц по дате покупки против февральского счётчика)
  severity: critical
  anchors: ["Месяц определяется по дате совершения покупки", "Февральский счётчик вырос"]
  keywords: ["месяц", "феврал", "дат"]

- id: D02
  title: Ф-3 «один push в месяц» противоречит Ф-4 «push независимо от истории»
  severity: critical
  anchors: ["максимум один такой push", "независимо от истории предыдущей настройки"]
  keywords: ["push", "один", "повтор", "огранич", "лимит"]

- id: D03
